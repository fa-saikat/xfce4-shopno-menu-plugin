name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 (Xfce 4.20)
            image: debian:trixie
            install: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              build-essential meson ninja-build gettext pkg-config
              libgtk-3-dev libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev libxfconf-0-dev libgarcon-1-dev
          - name: Ubuntu 24.04 (Xfce 4.18)
            image: ubuntu:24.04
            install: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              build-essential meson ninja-build gettext pkg-config
              libgtk-3-dev libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev libxfconf-0-dev libgarcon-1-dev
          - name: Fedora
            image: fedora:latest
            install: >-
              dnf install -y gcc meson ninja-build gettext gtk3-devel
              xfce4-panel-devel libxfce4ui-devel libxfce4util-devel xfconf-devel garcon-devel
          - name: Arch Linux
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed base-devel meson gettext gtk3
              xfce4-panel libxfce4ui libxfce4util xfconf garcon

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Configure
        run: meson setup build --prefix=/usr -Dwerror=true -Dpreview=true

      - name: Build
        run: meson compile -C build

      - name: Install
        run: DESTDIR="$PWD/staging" meson install -C build
